server {
    listen 80;
    listen [::]:80;
    server_name uptime.bayanko.ph;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/uptime-acme;
    }
    location / {
        return 301 https://uptime.bayanko.ph$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name uptime.bayanko.ph;
    ssl_certificate /etc/letsencrypt/live/uptime.bayanko.ph/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uptime.bayanko.ph/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
